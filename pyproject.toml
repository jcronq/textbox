[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textbox"
version = "0.1.0"
description = "Python library for building rich terminal user interfaces with curses"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jason Cronquist"},
]
keywords = [
    "terminal",
    "tui",
    "curses",
    "cli",
    "text-ui",
    "terminal-ui",
    "async",
    "rich-text",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
]

dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "isort>=5.12.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.22.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/jcronq/textbox"
Documentation = "https://github.com/jcronq/textbox/tree/main/docs"
Repository = "https://github.com/jcronq/textbox"
Issues = "https://github.com/jcronq/textbox/issues"

# ============================================================================
# Tool Configurations
# ============================================================================

[tool.setuptools]
packages = ["textbox", "textbox.core", "textbox.ui", "textbox.utils"]

[tool.setuptools.package-data]
textbox = ["py.typed"]

# Black - Code Formatter
[tool.black]
line-length = 119
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.pytest_cache
  | __pycache__
  | build
  | dist
  | textbox.bck
  | claude-output
)/
'''

# isort - Import Sorter
[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["venv/*", "textbox.bck/*", "claude-output/*"]

# Pytest - Testing Framework
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage - Code Coverage
[tool.coverage.run]
source = ["textbox"]
omit = [
    "*/tests/*",
    "*_test.py",
    "*/venv/*",
    "*/textbox.bck/*",
    "*/examples/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

# MyPy - Static Type Checker
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
pretty = true
show_error_codes = true
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "pytest.*",
    "pyyaml.*",
]
ignore_missing_imports = true

# Flake8 configuration (in .flake8 file or setup.cfg)
# Note: Flake8 doesn't support pyproject.toml natively yet
# Create a .flake8 file with these settings:
# [flake8]
# max-line-length = 119
# extend-ignore = E203, W503
# exclude = .git,__pycache__,venv,.venv,textbox.bck,claude-output
# per-file-ignores = __init__.py:F401

# Ruff - Fast Python Linter (alternative to flake8)
[tool.ruff]
line-length = 119
target-version = "py37"
extend-exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "textbox.bck",
    "claude-output",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports

[tool.ruff.lint.isort]
known-first-party = ["textbox"]

# Bandit - Security Linter
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "textbox.bck", "claude-output"]
skips = ["B101"]  # assert_used